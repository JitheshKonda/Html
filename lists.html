<!DOCTYPE html>
<html>
  <head>
    <title>HTML Lists </title>
  </head>
<body>
<h3>Unordered List</h3>
<ul>
  <li>Apple</li>
  <li>Banana</li>
</ul>
<h3>Ordered List</h3>
<ol>
  <li>HTML</li>
  <li>CSS</li>
</ol>
<h3>Description List</h3>
<dl>
  <dt>HTML</dt>
  <dd>Hyper Text Markup Language</dd>
</dl>
</body>
</html>
