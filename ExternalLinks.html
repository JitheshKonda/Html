<!DOCTYPE html>
<html>
<head>
    <title>External Links Example</title>
</head>
<body>
    <h2>HTML External Links</h2>
    <!-- Website Link -->
    <p>
        <a href="https://www.google.com">
            Open Google
        </a>
    </p>
    <!-- Open in New Tab -->
    <p>
        <a href="https://www.youtube.com" target="_blank">
            Open YouTube (New Tab)
        </a>
    </p>
    <!-- Email Link -->
    <p>
        <a href="mailto:abc@gmail.com">
            Send Email
        </a>
    </p>
    <!-- Phone Link -->
    <p>
        <a href="tel:+919876543210">
            Call Us
        </a>
    </p>
    <!-- Download File -->
    <p>
        <a href="sample.pdf" download>
            Download PDF
        </a>
    </p>
</body>
</html>
