<!DOCTYPE html>
<html>
<head>
    <title>Ordered and Unordered List</title>
</head>
<body>
    <h2>Ordered List</h2>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
    </ol>
    <h2>Unordered List</h2>
     <ul>
        <li>Pricipal</li>
        <li>HOD</li>
        <li>Class Teacher</li>
        <li>Student</li>
    </ul>
</body>
</html>
