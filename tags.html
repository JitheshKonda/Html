<!DOCTYPE html>
<html>
<head>
    <title>All Table Tags Example</title>
    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        caption {
            font-weight: bold;
            margin: 10px;
        }
    </style>
</head>
<body>

<table>
    <caption>Student Details</caption>

    <thead>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Class</th>
            <th>Marks</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>101</td>
            <td>Ravi</td>
            <td>10</td>
            <td>85</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Sita</td>
            <td>10</td>
            <td>90</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3">Average Marks</td>
            <td>87.5</td>
        </tr>
    </tfoot>
</table>

</body>
</html>
